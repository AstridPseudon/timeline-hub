[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astrid-runtime"
version = "0.1.0"
description = "Independent neutral local workspace runtime and bootstrap"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
astrid-runtime-protocol = "runtime_protocol.cli:main"
astrid-runtime = "astrid_runtime.cli:main"
astrid-runtime = "astrid_runtime.cli:main"

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["runtime_protocol*", "astrid_runtime*"]
exclude = ["build*", "tests*"]
