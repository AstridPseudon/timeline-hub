- test: tests/test_wan2gp_lifecycle.py::test_one_shot_cancellation_is_structured_before_engine_lookup
  reason: "Tested the one-shot native Wan2GP driver (driver.one_shot_run, C-M1), which spooled a per-attempt init()/close() run and returned a structured cancelled result before engine lookup. Commit 71d43e00 deleted one_shot_run and made the pack host-owned: GenericPackHost owns the retained native session and cancellation is exercised through CancellationToken and the persistent runner (test_cancellation_token_is_cooperative_and_idempotent and test_fake_cancellation_leaves_persistent_runner_warm, which still pass). No one-shot entry point exists to test."
  removed_by: "71d43e00"
- test: tests/test_wan2gp_lifecycle.py::test_generate_core_fail_closes_success_without_files
  reason: "Tested the one-shot success path of generate_video.generate_core (a DriverResult with no generated files must fail closed). Commit 71d43e00 removed the one-shot run from generate_core, which now only validates inputs and fails closed to host_session_required; the replacement guard is pinned by test_generate_core_refuses_direct_execution_for_valid_inputs. The no-files fail-closed invariant now belongs to driver.materialize_host_result and is pinned directly by test_materialize_host_result_fail_closes_success_without_files in the same file."
  removed_by: "71d43e00"
- test: tests/test_wan2gp_lifecycle.py::test_generate_core_receipt_identifies_video_collection
  reason: "Tested the one-shot success receipt of generate_video.generate_core (two generated clips reported as a video collection). Commit 71d43e00 removed the one-shot run from generate_core, so no receipt is produced there; collection and receipt evidence is produced by the GenericPackHost-owned session through driver.materialize_host_result and is pinned directly by test_materialize_host_result_receipt_identifies_video_collection in the same file."
