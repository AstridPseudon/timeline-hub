id: code.python.two-sets-one-save
source: AUDIT bug 10
intent: Set the c1 rocket x to 120 (x=60 before); a Python script that sets x twice before one save must end at x=120 with one undo step, as the CLI and sheet do.
fixture: tiny
expect: change
cli: >-
  edit --command '{"op":"timeline.batch","select":null,"args":{"commands":[{"op":"clip.set","select":"c1.rocket","args":{"x":90}},{"op":"clip.set","select":"c1.rocket","args":{"x":120}}]}}'
sheet:
  text: |-
    edit {"op":"clip.set","select":"c1.rocket","args":{"x":90}}
    edit {"op":"clip.set","select":"c1.rocket","args":{"x":120}}
python: |
  tl.clip("c1.rocket").set(x=90)
  tl.clip("c1.rocket").set(x=120)
check:
  - tl.clip("c1.rocket").get("x") == 120
