id: audio.add.media-bed
source: new
intent: Add a source-trimmed music clip independently of the picture cut.
fixture: audio-media
expect: change
cli: edit --add-media Q --track music --on 1 --for 3 --trim-in 2 --gain-db -5.8 --id music-bed
sheet:
  text: |
    edit {"op":"timeline.add-media","select":null,"args":{"asset":"Q","track":"music","at":1,"for_seconds":3,"trim_in":2,"clip_id":"music-bed"}}
    edit {"op":"clip.set-look","select":"music-bed","args":{"volume":"-5.8dB"}}
python: |
  from astrid.sdk.timeline.commands import run
  with tl.edit("Add and set music") as edit:
      edit.canonical = True
      run(tl, {"op": "timeline.add-media", "select": None, "args": {
          "asset": "Q", "track": "music", "at": 1, "for_seconds": 3,
          "trim_in": 2, "clip_id": "music-bed"}})
      tl.clip("music-bed").set_look(volume="-5.8dB")
check:
- tl.clip("music-bed").cut_id is None
- abs(tl.clip("music-bed").start - 1) < 1e-6
- abs(tl.clip("music-bed").duration - 3) < 1e-6
- tl.clip("music-bed").data["from"] == 2
- tl.clip("music-bed").data["to"] == 5
- abs(tl.clip("music-bed").data["volume"] - 10 ** (-5.8 / 20)) < 1e-4
