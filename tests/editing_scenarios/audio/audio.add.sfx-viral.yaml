id: audio.add.sfx-viral
source: h3 A3
intent: Add a short sound effect (asset Q, 0.3 s) on the spoken word "viral" in c1, without touching the rest of c1.
fixture: tiny
expect: change
cli: {missing: "no add-clip verb in the CLI (AUDIT: Missing tools, Add a clip by verb; h3 A3)"}
sheet:
  cuts: [c1]
  replace:
    - ["  1.30   sprite  rocket  sprite      R  on \"viral\"  x=60", "  1.30   sprite  rocket  sprite      R  on \"viral\"  x=60\n         vo      blip    media       Q  on \"viral\" for 0.3s"]
python: |
  tl.add("media", at='"viral"', layer="blip", hold=0.3, asset="Q", track="vo")
check:
  - abs(tl.clip("c1.blip").duration - 0.3) < 1e-6
  - abs(tl.clip("c1.blip").start - 1.3) < 1e-3
  - tl.clip("c1.rocket") is not None
