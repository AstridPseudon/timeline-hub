id: audio.add.sfx-viral
source: h3 A3
intent: Add a short sound effect (asset Q, 0.3 s) on the spoken word "viral", independent of the picture cut.
fixture: audio-media
expect: change
cli: edit --add-media Q --track vo --on '"viral"' --for 0.3 --id blip
sheet:
  text: |
    edit {"op":"timeline.add-media","select":null,"args":{"asset":"Q","track":"vo","at":"\"viral\"","for_seconds":0.3,"clip_id":"blip"}}
python: |
  from astrid.sdk.timeline.commands import run
  run(tl, {"op": "timeline.add-media", "select": None, "args": {
      "asset": "Q", "track": "vo", "at": '"viral"', "for_seconds": 0.3, "clip_id": "blip"}})
check:
- tl.clip("blip").cut_id is None
- abs(tl.clip("blip").duration - 0.3) < 1e-6
- abs(tl.clip("blip").start - 1.3) < 1e-3
- tl.clip("c1.rocket") is not None
