  - {path: cli, check: changes, reason: "AUDIT bug 4: CLI --set accepts unknown params silently (zzbogus=2 is stored on a-music)"}
  - {path: cli, check: steps, reason: "AUDIT bug 4: CLI --set accepts unknown params silently (zzbogus=2 is stored on a-music)"}
  - {path: python, check: runs, reason: "AUDIT bug 4: Python clip.set accepts an unknown param on a media clip (it refuses one on am-sprite/am-type)"}
  - {path: python, check: changes, reason: "AUDIT bug 4: Python clip.set accepts an unknown param on a media clip (it refuses one on am-sprite/am-type)"}
  - {path: python, check: steps, reason: "AUDIT bug 4: Python clip.set accepts an unknown param on a media clip (it refuses one on am-sprite/am-type)"}
