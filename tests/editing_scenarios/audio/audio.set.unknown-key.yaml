id: audio.set.unknown-key
source: AUDIT bug 4
intent: An undeclared param (zzbogus=2) on the music bed a-music is refused on every path.
fixture: tiny
expect: refused
cli: edit --clip a-music --set zzbogus=2
sheet:
  cuts: [c1]
  replace:
    - ["Q  for 4s", "Q  for 4s zzbogus=2"]
python: |
  tl.clip("a-music").set(zzbogus=2)
xfail:
