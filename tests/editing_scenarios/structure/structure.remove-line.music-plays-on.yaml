id: structure.remove-line.music-plays-on
source: W2 (new)
intent: Remove narration line s1 with --music plays-on, so the bed keeps playing unchanged (the old behaviour, now opt-in), so it runs past the film's new end.
fixture: tiny-bed8  # under keep_end the bed already runs to the film's 8 s end (e766a7d8), so no setup step
expect: change
cli:
  - edit --remove-line s1 --music plays-on
sheet: {missing: "the sheet cannot remove a narration line (harness H-5), so the music policy cannot run on the sheet either"}
python: |
  tl.remove_line("s1", music="plays_on")
check:
  - '"s1" not in [v.segment for v in tl.lines()]'
  - 'len([c for c in tl.clips() if c.track == "music"]) == 1'
  - 'max(c.end for c in tl.clips() if c.track == "music") > tl.duration + 1'
