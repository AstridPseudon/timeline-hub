id: structure.cut-on.c2-now
source: h1 T5
intent: Start cut c2 on the spoken word "now" (its picture moves to 6.4 s).
fixture: tiny
expect: change
cli: edit --cut c2 --on '"now"'
sheet:
  cuts: [c2]
  replace:
    - ['plate  plate  snap-plate  Q', 'plate  plate  snap-plate  Q  on "now"']
python: |
  tl.clip("c2.plate").on('"now"')
check:
  - abs(tl.clip("c2.plate").start - 6.4) < 1e-3
xfail:
  - {path: cli, check: check, reason: "NEW: --cut c2 --on 'now' stores the moment but does not move the cut: readout 'it was already there' with 4.00 s; check says 'its moment (6.400 s) is kept for re-flow, not applied' (the audit h1 T5 move of c05 worked; this one does not)"}
  - {path: sheet, check: check, reason: "NEW: the sheet stores the requested moment but does not re-flow or move the cut; c2.plate stays at 4.0 s, matching the known CLI and Python behavior"}
  - {path: python, check: check, reason: "NEW: Python clip('c2.plate').on('now') stores the moment but c2.plate stays at 4.0 s (same as --cut c2 --on)"}
