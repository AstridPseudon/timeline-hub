id: structure.cut-on.c2-now
source: h1 T5
intent: Start cut c2 on the spoken word "now" (its picture moves to 6.4 s).
fixture: cut-move
expect: change
cli: edit --cut c2 --on '"now"'
sheet:
  text: 'edit {"op":"cut.move","select":"c2","args":{"on":"\"now\""}}'
python: |
  tl.cut("c2").move('"now"')
check:
  - abs(tl.clip("c2.plate").start - 6.4) < 1e-3
  - >
    [(c.id, round(c.start - tl.clip("b-plate").start, 6), c.duration) for c in tl._cut_clips("c2")] == [("b-plate", 0.0, 1.0), ("b-sfx", 0.2, 0.5), ("b-type", 0.3, 1.0)]
  - before["placements"][0] == tl.document()["placements"][0]
  - before["shots"]["A"] == tl.document()["shots"]["A"]
