id: look.add-then-swap.sprite
source: h2 L6 (AUDIT bug 3)
intent: Add a sprite on "now" in c2 at x=600 y=300 and give it asset R; the position and the asset must survive.
fixture: tiny
expect: change
cli: >-
  edit --command '{"op":"timeline.batch","select":null,"args":{"commands":[{"op":"timeline.add","select":null,"args":{"element":"am-sprite","at":"\"now\"","layer":"pin","hold":1.5,"params":{"x":600,"y":300}}},{"op":"clip.swap-asset","select":"am-sprite-01","args":{"asset":"R"}}]}}'
sheet:
  text: |-
    edit {"op":"timeline.add","select":null,"args":{"element":"am-sprite","at":"\"now\"","layer":"pin","hold":1.5,"params":{"x":600,"y":300}}}
    edit {"op":"clip.swap-asset","select":"am-sprite-01","args":{"asset":"R"}}
python: 'tl.add("am-sprite", at=''"now"'', layer="pin", hold=1.5, params={"x": 600, "y": 300}).swap_asset("R")

  '
check:
- tl.clip("c2.pin").asset == "R"
- tl.clip("c2.pin").get("x") == 600
- tl.clip("c2.pin").get("y") == 300
