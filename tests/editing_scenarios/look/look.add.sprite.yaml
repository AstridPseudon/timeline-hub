id: look.add.sprite
source: h2 L6/L8
intent: Add a sprite with asset R on the spoken word "now" in c2, at x=600 y=300 (canvas px), held 1.5 s.
fixture: tiny
expect: change
cli: {missing: "no add verb in the CLI (AUDIT: Missing tools, Add a clip by verb; h2 L6)"}
sheet:
  cuts: [c2]
  replace:
    - ["         type   card   type        \"Live.\"  for 1s", "         type   card   type        \"Live.\"  for 1s\n         sprite pin    sprite      R  on \"now\" for 1.5s x=600 y=300"]
python: |
  tl.add("am-sprite", at='"now"', layer="pin", hold=1.5, asset="R", params={"x": 600, "y": 300})
check:
  - abs(tl.clip("c2.pin").duration - 1.5) < 1e-6
  - tl.clip("c2.pin").get("x") == 600
  - tl.clip("c2.pin").get("y") == 300
  - tl.clip("c2.pin").asset == "R"
xfail:
  - {path: python, check: check, reason: "AUDIT bug 3 family (NEW units detail): tl.add(params={'x': 600}) on am-sprite stores x=600 unscaled, so get('x') reads 3600 canvas px (y 1800); the sheet and the CLI units give 600/300"}
  - {path: sheet, check: equal, reason: "AUDIT bug 3 family: the sheet's x=600 y=300 (stored 100/50) differs from the Python add (see python check: 3600/1800 canvas)"}
