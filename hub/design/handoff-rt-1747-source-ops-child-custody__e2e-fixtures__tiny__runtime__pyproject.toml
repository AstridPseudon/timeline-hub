[build-system]
requires = ["setuptools==80.9.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "astrid-runtime"
version = "0.1.0"

[project.scripts]
astrid-runtime = "astrid_runtime:main"
astrid-runtime-protocol = "runtime_protocol:main"

[tool.setuptools.packages.find]
include = ["astrid_runtime", "runtime_protocol"]
