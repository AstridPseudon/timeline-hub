# Default run per push (testing plan UA.1). Heavy lanes (integration, darwin_native, live, opt_in) run nightly elsewhere.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install package with dev extras
        run: python -m pip install -e '.[dev]'

      - name: Repo structure gate
        run: make structure

      - name: Ruff baseline gate
        run: make ruff

      - name: Mypy baseline gate
        run: make mypy

      - name: Import cycles gate
        run: make cycles

      - name: Unit tests (default lane)
        run: python -m pytest -q
