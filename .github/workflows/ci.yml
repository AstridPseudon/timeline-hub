# Default run per push (testing plan UR.5); the second-client boundary test as its own job.
name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    # Windows port in progress: feat/runtime-portable
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system media tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
        shell: bash
      - name: Install system media tools (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress
      - name: Install system media tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q -n 2

  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests/test_second_client_e2e.py -m ""

  portability-lifecycle:
    # Windows port in progress (M2/M3): its leg may fail until then.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pip install -e packages/python
      - run: >-
          python -m pytest -q -m ""
          tests/test_platform.py
          tests/test_platform_windows.py
          tests/test_platform_filesystem.py
          tests/test_dirfd_windows.py
          tests/test_m1_review.py
          tests/test_foreground.py
          tests/test_native_custody.py
          tests/test_portable_lifecycle.py
