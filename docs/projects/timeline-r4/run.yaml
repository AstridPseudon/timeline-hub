# Direct human challenge to historical-input bureaucracy, adjudicated by root-only Astra.
# Execution ordering only: original card/release acceptance and all review budgets remain intact.
execution_readiness_policy:
  decision: R4-HISTORICAL-IMPLEMENTATION-GATE-001
  human_direction: amendments/20261015-human-historical-gate-challenge.json
  ruling: receipts/codex-exec/oracle-R4-HISTORICAL-IMPLEMENTATION-GATE-001.result.md
  ruling_sha256: 4199027c51b768ca7ca4f49f23c3fc9c1c92ec76e272bc9c3e08deb6090b04e8
  source_integration_owner: A
  states: [implementation_integrated, dependency_available, fully_verified_card_accepted]
  scheduling: concrete_producer_consumer_predicates
  readiness_table: dependency-graph.json#execution_readiness
  original_acceptance_and_release_edges: preserved
  historical_proof_debt: explicit_affected_criteria_only
  current_source_evidence: implementation_readiness_and_behaviors_actually_exercised
  historical_equivalence_from_current_tests: forbidden
  integrate_before_full_verification:
    allowed: true
    requires: [A_integration_inspection, admitted_isolated_source, focused_combined_checks]
    moves_frozen_pins: false
    accepts_card_or_release: false
  handback_queue_exception:
    scope: A_integrated_reviewed_tested_code_with_only_named_external_verification_debt
    stops_counting_after: code_integration_and_recorded_predicates
    still_count: [unreviewed_code, failed_tests, conflicts, incomplete_implementation, missing_required_interface]
    admission_feedback: observed_integration_backlog_and_A_drain_capacity
  execution_simplification:
    ruling: receipts/oracle-R4-REMAINING-EXECUTION-SIMPLIFICATION-093.md
    ruling_sha256: 49e5787602cb00904d039b2b2294537aff35a9720e545fcc8ce961317180a583
    disposition: change_approach_preserve_full_product_scope
    effective_after: current_approved_cleanup_release_by_root
    preserve: [all_95_cards, all_3_releases, original_acceptance_edges, IP0_IP8, roles, review_budgets, human_security_data_publication_migration_gates]
    working_lanes: [continuous_editing_and_save_reload_retry_journey, remaining_independent_capabilities_and_proof]
    integration: A_owns_one_evolving_candidate_and_normal_operator; integrate_useful_returns_promptly
    receiver_policy: reuse_exclusively_owned_receivers_and_compatible_qualified_dependencies; additional_checkout_only_for_actual_conflicting_writer_incompatible_closure_or_required_frozen_execution
    artifact_lifecycle_ruling: receipts/codex-exec/oracle-R4-PROJECT-STORAGE-GROWTH-PREVENTION-229.result.md
    artifact_lifecycle_ruling_sha256: eaf6da9a7f47e6890e299968d65388fec8310a19b3ddcbcf38a42fd79dafad1c
    artifact_reuse: match_source_dependency_lock_interpreter_platform_and_build_options; build_once_per_changed_consumed_identity
    scratch_lifetime: phase_owned; release_exact_obsolete_derivatives_after_consumers_and_unique_evidence_retained
    retirement: retained_origin_and_recipe_no_unique_modifications_no_active_or_frozen_path_binding_and_applicable_lifecycle_settlement; no_whole_card_or_successful_wheel_requirement
    handback_storage_fields: [owned_paths, retained_origin, consumer_release_condition]
    next_actual_phase_measurement: existing_free_samples_and_owned_staging_output_sizes_at_start_peak_transition_completion; separate_path_counted_size_from_filesystem_delta
    evidence_policy: current_status_front_plus_existing_tasklist_plus_one_compact_handback_per_useful_increment
    validation_policy: focused_changed_boundaries_then_combined_joins_then_required_release_checks; reuse_unchanged_evidence
    prohibited_repetition: [per_step_handoffs, duplicate_history_mirrors, repeated_installs, unchanged_broad_suites, redundant_baseline_discovery, routine_oracle_calls]
    oversight: preserve_explicit_user_scheduled_cadence_and_selected_models; cadence_does_not_require_an_oracle_call
  unchanged: [roles, review_stages, review_budgets, actual_platform_constraints, heavy_leases, data_authority, human_gates, publication, live_migration]

