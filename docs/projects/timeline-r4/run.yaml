# Canonical coordinator-readable Megado configuration. This is not a scheduler or launcher.
# Native/manual hierarchy: root orchestrator -> Luna/xhigh managers -> normal Luna/xhigh or XHARD Sol/high leaves.
# Blockers route leaf -> manager -> orchestrator; only the orchestrator invokes the Astra/high oracle.
# Current host model is unestablished (metadata only); these bindings do not switch a running host.
# Stage invocations remain subject to historical-count reconciliation in status.md; never assume 0 consumed.
mode: delivery
source_custody: worktree
execution_routes:
  # Later explicit user steering authorizes Codex Exec alongside native agents; no Otto.
  native_collaboration: {active_slot_limit: 4}
  codex_exec: {authorized: true, delivery_elapsed_timeout_minutes: null, bounded_fact_timeout: explicit_per_assignment, preserve_manager_ownership: true, delivery_permission_default: danger-full-access, approval_policy: never, explicit_read_only_override: true, permission_authority: direct_human_20261015, permissions_do_not_expand_task_or_data_authority: true}
oversight:
  # User-requested coordination checks; these do not change product review stages/counters.
  hourly_heartbeat: timeline-r4-hourly-execution-check
  strategy_heartbeat: timeline-r4-three-hour-astra-strategy-check
  strategy_interval_hours: 3
  strategy_role: oracle
  strategy_scope: coordination_direction_due_diligence_and_efficiency
  retained_speed_advisor: {native_agent: ${OLD_OWNER_HANDLE}, model: gpt-6-astra, reasoning: high, root_only: true}
  strategy_context_policy: resume_retained_advisor_with_compact_changed_evidence
  strategy_report_directory: strategy-reports
  strategy_reporting_policy: strategy-reports/README.md
  strategy_report_cadence_state: strategy-reports/cadence.json
  strategy_second_opinion: {every_completed_primary_checks: 2, model: gpt-6-astra, reasoning: high, context: fresh, requested_by_primary: true, primary_disposition_required: true, luna_xhigh_fact_delegation: true}
  # Direct human authorization: narrow scheduled-strategy delegation exception to root-only delivery oracle invocation.
  strategy_delegation: {primary_role: strategy_coordinator_oracle, primary_may_dispatch_second_opinion: true, primary_is_actual_second_opinion_invoker: true, root_launches_scheduled_second_opinion: false, secondary_may_delegate_luna_facts: true, root_executes_manager_actions: true, product_review_or_authority_expansion: false}
  ordinary_engineering_requires_advisor: false
roles:
  # Root/orchestrator launch default; not a claim about the current session model.
  coordinator: {model: gpt-6-luna, reasoning: medium}
  manager: {model: gpt-6-luna, reasoning: xhigh}
  worker_normal: {model: gpt-6-luna, reasoning: xhigh}
  worker_xhard: {model: gpt-6.1-sol, reasoning: high}
  reviewer_normal: {model: gpt-6-luna, reasoning: xhigh}
  reviewer_xhard: {model: gpt-6.1-sol, reasoning: high}
  oracle: {model: gpt-6-astra, reasoning: high}
  # XHARD final rationale: integrated timing/identity, save/retry/migration, renderer closure, and security interactions can hide silent loss.
  final_reviewer: {model: gpt-6.1-sol, reasoning: high}
oracle: {} # Uncapped; root/orchestrator only. No new oracle call is authorized by this planning config.
resources:
  # Measured resource admission and actual contention coordination; no fixed coding/project ceilings.
  coding_workers:
    admission: adaptive_measured_resources_and_ready_inputs
    fixed_worker_ceiling: none
    swap_usage_alone_stops_admission: false
    assess: [memory_pressure, projected_disk_outputs_temp_and_swap, CPU_IO_contention, test_contention, meaningful_progress, integration_throughput]
    pressure_response: defer_new_costly_or_conflicting_work_first_then_adjust_affected_scope
    includes: [PRACTICE agents]
  active_projects:
    merge_project: A
    admission: ready_inputs_and_observed_capacity
    fixed_project_ceiling: none
    keep_a_manager_logically_attached: true
    project_managers: lazy_launch_or_resume
    require_all_ten_manager_processes: false
    discover_native_agent_and_nesting_limits_before_dispatch: true
  handed_back_unmerged:
    admission_feedback: observed_integration_backlog_and_A_drain_capacity
    prioritize: integration_and_defect_resolution
    global_queue_depth_stop: none
    external_verification_debt_counts_as_unresolved_code: false
    reduce_work_that_worsens_actual_bottleneck: true
    unrelated_inexpensive_ready_work_may_continue: true
  heavy_jobs:
    owner: project_a_manager
    maximum_weight_2_or_higher_at_once: 1
    weights:
      light_frame_browser_visualize: 1
      journey_or_full_suite: 2
      full_film_render: 3
    # Preserve these legacy keys for launcher compatibility; classify by measured actual workload, not task name.
    actual_cost_admission:
      ruling: receipts/oracle-R4-SPEED-ADVISOR-093-FOLLOWUP-003.md
      ruling_sha256: 451780ad77fe1247e379edf65dc49304e2cc1e86e66a6e6a382ca6f2c20b7363
      basis: measured_memory_cpu_io_disk_output_and_contention
      no_host_lease: [source_preparation, focused_selectors, small_private_api_or_cli, bounded_inexpensive_audio_sample]
      shared_weight_1: [lightweight_browser, single_frame, bounded_render]
      exclusive_weight_2: [substantial_multiprocess_browser, materially_loaded_full_suite, sustained_expensive_encode]
      exclusive_weight_3: [full_film_render]
      task_label_alone_does_not_raise_weight: true
      reclassify_before_entering_a_more_expensive_phase: true
    # Scope and real lifecycle/authority checks bound work; elapsed age alone never stops a healthy delivery job.
    light_frame_browser_timeout_minutes: null
    lease:
      required: true
      mechanism: existing_or_adopted_machine_wide_shared_compatible_lease
      adopted_protocol: amendments/20261015-pragmatic-heavy-admission.md
      host_lock_path: ${RECEIVING_HOST_LOCK_PATH}
      sharing: shared_weight_1_exclusive_weight_2_and_3
      participation: bound_portfolio_launchers_no_universal_other_session_acknowledgment
      otto_runtime: false
      start_new_service: false
      if_unavailable: hold_heavy_work
      before_start_record: [lease_identity, owner, weight_time_semantics, sharing, machine_state, input_and_data_custody]
    slot_exhaustion: route_exact_brief_via_orchestrator_preserving_manager_ownership
review_stages:
  # Future allocation only; max_rounds is the total stage cap, not proof of remaining allowance.
  # The before-acceptance readiness point is coordinator-recognized inside this card; not a new task or review stage.
  - id: CONTRACT-COMMIT
    after: "CONTRACT-COMMIT implementation and bounded evidence ready; before card acceptance/schema freeze"
    reviewer_role: reviewer_xhard
    lens: completion
    scope_tasks: [CONTRACT-COMMIT]
    criteria_source: cards.md
    criteria: ["A#contract-commit"]
    max_rounds: 1
  # Before-acceptance review is the card allocation; IP3 is later integration evidence, not a second call.
  - id: COMMIT
    after: "COMMIT rebase/commit diff and bounded evidence ready; before card acceptance and IP3"
    reviewer_role: reviewer_xhard
    lens: completion
    scope_tasks: [COMMIT]
    criteria_source: cards.md
    criteria: ["D#commit-service"]
    max_rounds: 1
  # Trigger excludes the examiner verdict and owner sign-off to avoid a FINAL-R3 acceptance cycle.
  - id: FINAL-R3
    after: "Full capability candidate and applicable proof ready; before FINAL-R3 examiner verdict and owner sign-off"
    reviewer_role: final_reviewer
    lens: completion_and_strategy
    scope_tasks:
