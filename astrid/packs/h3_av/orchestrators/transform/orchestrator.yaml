schema_version: 1
id: h3_av.transform
name: Transform with H3 audiovisual requests
kind: built_in
version: 0.1.0
short_description: Prepare, compile, run, compose, verify, and publish a bounded H3 audiovisual transformation.
description: Coordinates pack executors and VibeComfy through SDK capability invocation; it creates no second task authority.
keywords: [h3, minimax, continuation, vibecomfy, runpod]
inputs:
  - name: request
    type: file
    required: true
    description: H3 audiovisual request v1 or v2 JSON/YAML document, including opt-in native-v2 Character Swap.
  - name: asset_map
    type: file
    required: true
    description: JSON map from request asset ids to runtime-managed local input paths.
  - name: execution_request
    type: file
    required: false
    description: Optional normalized target/lifecycle request for the VibeComfy child.
child_executors:
  - h3_av.prepare
  - h3_av.compile
  - vibecomfy.validate
  - vibecomfy.run
  - h3_av.compose
  - h3_av.verify
  - h3_av.publication_finalizer
child_orchestrators: []
runtime:
  kind: command
  command:
    argv:
      - "{python_exec}"
      - -m
      - astrid.packs.h3_av.orchestrators.transform.run
      - --request
      - "{request}"
      - --asset-map
      - "{asset_map}"
      - --out
      - "{out}"
      - --execution-request
      - "{execution_request}"
      - "{orchestrator_args}"
cache:
  mode: none
isolation:
  mode: subprocess
  network: true
  # The orchestrator performs the canonical VibeComfy admission preflight
  # before it invokes the child run capability. Keep the explicitly selected
  # sibling checkout and its import path available to that child. The local
  # Runtime support root is also needed by the orchestrator's public SDK
  # bootstrap; the runner intentionally strips undeclared parent variables.
  env_passthrough: [ASTRID_RUNPOD_ACCOUNT_REF, ASTRID_H3_CANDIDATE_MANIFEST, ASTRID_H3_T9_MODEL_SUBSTITUTE_PROFILE, BANODOCO_LOCAL_DATA_ROOT, VIBECOMFY_CHECKOUT, PYTHONPATH, VIBECOMFY_HEADLESS]
  requirements: [vibecomfy]
docs:
  stage: STAGE.md
metadata:
  runtime_entrypoint: main
  runtime_file: run.py
  runtime_module: astrid.packs.h3_av.orchestrators.transform.run
